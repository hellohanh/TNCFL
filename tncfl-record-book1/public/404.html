<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>TNCFL Record Book</title>
    <script type="text/javascript">
      // GitHub Pages has no server-side rewrites — it's a plain static file
      // host, so a direct link to a client-side route (anything other than
      // the site root) has no real file to match and GitHub serves ITS OWN
      // 404 instead of ever reaching this app. Standard workaround (the
      // widely-used "spa-github-pages" pattern): GitHub Pages serves THIS
      // file (still with a real 404 status) for any unmatched path, as long
      // as it exists at the site root — so this script encodes the intended
      // path into a query string and redirects to the real index.html,
      // which decodes it back (see the matching script in index.html) and
      // restores the correct URL via history.replaceState BEFORE React
      // Router ever reads it. pathSegmentsToKeep is 1 because this is a
      // project-page repo served under one path segment (/TNCFL/), not a
      // username.github.io root repo.
      var pathSegmentsToKeep = 1
      var l = window.location
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash,
      )
    </script>
  </head>
  <body></body>
</html>
