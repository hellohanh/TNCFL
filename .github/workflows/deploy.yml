name: Deploy TNCFL Hub to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy deploy files to docs/
        run: |
          mkdir -p docs/icons
          cp tncfl/TNCFL_hub.html  docs/
          cp tncfl/site_data.json  docs/
          cp tncfl/header_logo.png docs/
          cp tncfl/salary_logo.png docs/
          cp tncfl/h2h_logo.png    docs/
          cp tncfl/manifest.json   docs/
          cp tncfl/sw.js           docs/
          cp tncfl/icons/icon-192.png docs/icons/
          cp tncfl/icons/icon-512.png docs/icons/
          # server.py is intentionally NOT copied — it is local-only.

      - name: Commit and push docs/
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --staged --quiet || git commit -m "deploy: update hub [skip ci]"
          git push
